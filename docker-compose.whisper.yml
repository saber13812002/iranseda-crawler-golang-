# IranSeda Whisper — GPU worker + optional API on server 53.
# Host networking (53's docker bridge DNS is broken). GPU0 via CDI.
# Model (whisper-4-persian, CT2 int8) mounted read-only from /home/saber/whisper-models.
services:
  whisper-worker:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    image: iranseda-whisper:latest
    container_name: iranseda-whisper-worker
    restart: unless-stopped
    network_mode: host
    working_dir: /app/whisper
    command: ["python3", "worker.py"]
    environment:
      WHISPER_MODEL: /models/whisper-persian-v4-ct2
      WHISPER_LANGUAGE: "fa"
      WHISPER_COMPUTE: "int8"
      CUDA_VISIBLE_DEVICES: "0"
      DB_HOST: "172.20.1.53"
      DB_PORT: "3308"
      DB_USER: "n8nuser"
      DB_PASS: "StrongPassword123!"
      DB_NAME: "radio"
      WORK_DIR: "/tmp/whisper-worker"
      BATCH_SIZE: "1"
      KEEP_MP4: "0"
      MAX_ATTEMPTS: "3"
      IDLE_SLEEP: "20"
      DELAY_BETWEEN: "2"
      SSH_TARGET: ""
      REMOTE_DOWNLOADS: "/home/saber/saberprojects/iranseda-crawler-golang-/downloads"
      LOCAL_DOWNLOADS_DIR: "/home/saber/saberprojects/iranseda-crawler-golang-/downloads"
    volumes:
      - ./downloads:/home/saber/saberprojects/iranseda-crawler-golang-/downloads
      - ./services/whisper:/app/whisper
      - /home/saber/whisper-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]

  whisper-api:
    image: iranseda-whisper:latest
    container_name: iranseda-whisper-api
    restart: unless-stopped
    network_mode: host
    working_dir: /app/whisper
    command: ["python3", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "9500"]
    environment:
      WHISPER_MODEL: /models/whisper-persian-v4-ct2
      WHISPER_LANGUAGE: "fa"
      WHISPER_COMPUTE: "int8"
      CUDA_VISIBLE_DEVICES: "0"
      DB_HOST: "172.20.1.53"
      DB_PORT: "3308"
      DB_USER: "n8nuser"
      DB_PASS: "StrongPassword123!"
      DB_NAME: "radio"
    volumes:
      - /home/saber/whisper-models:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
