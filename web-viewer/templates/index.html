<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لیست برنامه‌های رادیو</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
        }
        .program-card {
            transition: transform 0.2s;
        }
        .program-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="/">رادیو ایران</a>
            <div class="d-flex">
                <button class="btn btn-light" onclick="createBackup()">ایجاد نسخه پشتیبان</button>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row mb-4">
            <div class="col">
                <div class="input-group">
                    <input type="text" class="form-control" id="searchInput" placeholder="جستجو در برنامه‌ها...">
                    <button class="btn btn-outline-secondary" type="button" onclick="searchPrograms()">
                        <i class="bi bi-search"></i>
                    </button>
                </div>
            </div>
        </div>

        <div class="row" id="programsList">
            {{range .programs}}
            <div class="col-md-4 mb-4">
                <div class="card program-card h-100">
                    <div class="card-body">
                        <h5 class="card-title">{{.Title}}</h5>
                        <p class="card-text">{{.Description}}</p>
                        <div class="d-flex justify-content-between align-items-center">
                            <small class="text-muted">تعداد زیرنویس: {{len .Subtitles}}</small>
                            <a href="/program/{{.ID}}" class="btn btn-primary">مشاهده جزئیات</a>
                        </div>
                    </div>
                    <div class="card-footer text-muted">
                        آخرین به‌روزرسانی: {{.UpdatedAt.Format "2006/01/02 15:04"}}
                    </div>
                </div>
            </div>
            {{end}}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function createBackup() {
            fetch('/api/backup', {
                method: 'POST'
            })
            .then(response => response.json())
            .then(data => {
                alert('نسخه پشتیبان با موفقیت ایجاد شد');
            })
            .catch(error => {
                alert('خطا در ایجاد نسخه پشتیبان');
            });
        }

        function searchPrograms() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const programs = document.querySelectorAll('.program-card');
            
            programs.forEach(program => {
                const title = program.querySelector('.card-title').textContent.toLowerCase();
                const description = program.querySelector('.card-text').textContent.toLowerCase();
                
                if (title.includes(searchTerm) || description.includes(searchTerm)) {
                    program.parentElement.style.display = '';
                } else {
                    program.parentElement.style.display = 'none';
                }
            });
        }
    </script>
</body>
</html>
