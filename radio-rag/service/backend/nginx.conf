server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # SPA / static fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets: never proxy, sensible cache
    location ~* \.(css|js|svg|png|jpg|jpeg|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Proxy API requests to THIS service's backend (radio_api:8003).
    # __API_UPSTREAM__ is substituted at container start by entrypoint.sh.
    location /api/ {
        proxy_pass http://__API_UPSTREAM__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
