version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: iranseda-mysql
    hostname: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: radio
      MYSQL_USER: n8nuser
      MYSQL_PASSWORD: StrongPassword123!
    # Host port 3308 to avoid conflict with native MariaDB (3306) and
    # the CMS docker MySQL (3307) already running on this server.
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Full/latest dump (Navicat, 2025-11-29). radio_programs.sql is a
      # legacy old-schema dump and must NOT be auto-run (it drops the
      # real radio_programs table). The 2025-11-19 legacy-columns
      # migration is already baked into radio.sql, so it is not re-applied.
      - ./radio.sql:/docker-entrypoint-initdb.d/01-radio.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_allowed_packet=1G
      - --wait_timeout=28800
      - --interactive_timeout=28800
      - --net_read_timeout=300
      - --net_write_timeout=300
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
