version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: iranseda-mysql
    hostname: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: radio
      MYSQL_USER: n8nuser
      MYSQL_PASSWORD: StrongPassword123!
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-restore database dump on first run
      - ./radio.sql:/docker-entrypoint-initdb.d/01-radio.sql
      - ./radio_programs.sql:/docker-entrypoint-initdb.d/02-radio_programs.sql
      - ./migrations:/docker-entrypoint-initdb.d/migrations
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --max_allowed_packet=1G
      - --wait_timeout=28800
      - --interactive_timeout=28800
      - --net_read_timeout=300
      - --net_write_timeout=300
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
